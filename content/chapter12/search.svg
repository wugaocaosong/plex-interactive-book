<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-labelledby="title"><title id="title">通讯舱 · 定位有序信号</title><rect width="600" height="340" rx="18" fill="#131315"/><g font-family="sans-serif"><text x="300" y="35" fill="#F7EEDB" font-size="23" text-anchor="middle">通讯舱 · 定位有序信号</text><text x="300" y="76" fill="#F7EEDB" font-size="16" text-anchor="middle">寻找目标信号 6 · 比较中点后缩小区间</text><rect x="70.0" y="123" width="60" height="34" rx="8" fill="#242723" stroke="#D9B873"/><text x="100" y="145" fill="#F7EEDB" font-size="18" text-anchor="middle">1</text><text x="100" y="181" fill="#F7EEDB" font-size="13" text-anchor="middle">索引 0</text><rect x="170.0" y="123" width="60" height="34" rx="8" fill="#242723" stroke="#D9B873"/><text x="200" y="145" fill="#F7EEDB" font-size="18" text-anchor="middle">3</text><text x="200" y="181" fill="#F7EEDB" font-size="13" text-anchor="middle">索引 1</text><rect x="270.0" y="123" width="60" height="34" rx="8" fill="#242723" stroke="#D9B873"/><text x="300" y="145" fill="#F7EEDB" font-size="18" text-anchor="middle">6</text><text x="300" y="181" fill="#F7EEDB" font-size="13" text-anchor="middle">索引 2</text><rect x="370.0" y="123" width="60" height="34" rx="8" fill="#242723" stroke="#D9B873"/><text x="400" y="145" fill="#F7EEDB" font-size="18" text-anchor="middle">8</text><text x="400" y="181" fill="#F7EEDB" font-size="13" text-anchor="middle">索引 3</text><rect x="470.0" y="123" width="60" height="34" rx="8" fill="#242723" stroke="#D9B873"/><text x="500" y="145" fill="#F7EEDB" font-size="18" text-anchor="middle">12</text><text x="500" y="181" fill="#F7EEDB" font-size="13" text-anchor="middle">索引 4</text><text x="300" y="225" fill="#F7EEDB" font-size="19" text-anchor="middle">中点 = (左边界 + 右边界) // 2</text><text x="300" y="267" fill="#F7EEDB" font-size="17" text-anchor="middle">目标更小 → 左半边    目标更大 → 右半边</text><text x="300" y="310" fill="#D9B873" font-size="16" text-anchor="middle">相等就返回索引；区间为空则未找到</text></g></svg>
