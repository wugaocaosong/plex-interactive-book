server {
    listen 80;
    server_name genius.wuyeni.cn;
    root /www/wwwroot/genius.wuyeni.cn;
    index index.html;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { try_files $uri $uri.html $uri/ =404; }
    location /api/ { default_type application/json; return 503 '{"message":"Online PLEX service is not configured on this site."}'; }
    location ~ /\. { deny all; }
    access_log /www/wwwlogs/genius.wuyeni.cn.log;
    error_log /www/wwwlogs/genius.wuyeni.cn.error.log;
}
