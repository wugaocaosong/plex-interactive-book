server {
    listen 80;
    server_name genius.wuyeni.cn;
    root /www/wwwroot/genius.wuyeni.cn;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://genius.wuyeni.cn$request_uri; }
}
server {
    listen 443 ssl;
    server_name genius.wuyeni.cn;
    ssl_certificate /etc/letsencrypt/live/genius.wuyeni.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/genius.wuyeni.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /www/wwwroot/genius.wuyeni.cn;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location /api/ {
        default_type application/json;
        return 503 '{"message":"Online PLEX service is not configured on this site."}';
    }
    location ~ /\. { deny all; }
    location ~* \.(?:mjs|js)$ { types {} default_type application/javascript; try_files $uri =404; }
    location ~* \.wasm$ { types {} default_type application/wasm; try_files $uri =404; }
    location / { try_files $uri $uri.html $uri/ =404; }
    access_log /www/wwwlogs/genius.wuyeni.cn.log;
    error_log /www/wwwlogs/genius.wuyeni.cn.error.log;
}
