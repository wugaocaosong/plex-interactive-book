<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-labelledby="title"><title id="title">能源环 · 汉诺塔搬运</title><rect width="600" height="340" rx="18" fill="#131315"/><g font-family="sans-serif"><text x="300" y="35" fill="#F7EEDB" font-size="23" text-anchor="middle">能源环 · 汉诺塔搬运</text><text x="300" y="76" fill="#F7EEDB" font-size="17" text-anchor="middle">一次一环 · 只取顶部 · 小环在大环上</text><rect x="106" y="115" width="8" height="150" rx="4" fill="#4F8D86"/><rect x="45" y="264" width="130" height="8" rx="4" fill="#D9B873"/><text x="110" y="299" fill="#F7EEDB" font-size="17" text-anchor="middle">A 源柱</text><rect x="296" y="115" width="8" height="150" rx="4" fill="#4F8D86"/><rect x="235" y="264" width="130" height="8" rx="4" fill="#D9B873"/><text x="300" y="299" fill="#F7EEDB" font-size="17" text-anchor="middle">B 缓冲柱</text><rect x="486" y="115" width="8" height="150" rx="4" fill="#4F8D86"/><rect x="425" y="264" width="130" height="8" rx="4" fill="#D9B873"/><text x="490" y="299" fill="#F7EEDB" font-size="17" text-anchor="middle">C 目标柱</text><rect x="53.0" y="242" width="114" height="24" rx="10" fill="#4F8D86" stroke="#F7EEDB"/><rect x="68.0" y="213" width="84" height="24" rx="10" fill="#4F8D86" stroke="#F7EEDB"/><rect x="83.0" y="184" width="54" height="24" rx="10" fill="#4F8D86" stroke="#F7EEDB"/><text x="320" y="161" fill="#F7EEDB" font-size="16" text-anchor="middle">先把上方的小环</text><text x="320" y="189" fill="#F7EEDB" font-size="16" text-anchor="middle">移到缓冲柱</text></g></svg>
